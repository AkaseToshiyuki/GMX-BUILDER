# GMXBUILDER — example build configuration
#
#     gmxbuilder build -c examples/build_example.yaml
#
# Every key below is one the modules actually accept. An earlier version of
# this file used composition_upper / composition_lower, orient.algorithm and a
# top-level simparams block, none of which are recognised, so following it
# could not produce a build. tests/test_example_config.py now validates this
# file against the real modules.

system_name: example_membrane_protein
output_dir: ./output
seed: 42

modules:
  # ---- Input structure ----
  # .pdb, .ent, .cif and .mmcif are accepted, gzipped or not.
  input:
    pdb: ./input.pdb

  # ---- Force field ----
  # lipid_ff must match the protein force field: charmm36 for charmm36,
  # charmm36m for charmm36m, lipid21 for amber14sb. `gmxbuilder list-lipids`
  # shows which force fields can build each lipid.
  forcefield:
    name: charmm36
    lipid_ff: charmm36
    water_model: tip3p

  # ---- Structure processing ----
  # Omitting `protonation` lets the builder assign every titratable residue
  # from model pKa values at this pH. Supply a list to override that; supplying
  # an empty list is an error, since it states that the list is complete.
  structure:
    pH: 7.0
    skip_protonation: false

  # ---- Membrane orientation ----
  orient:
    method: ppm

  # ---- Membrane ----
  # Use lipid_type for a single lipid, or lipid_composition for a mixture.
  # Ratios are relative and need not sum to 100.
  membrane:
    lipid_composition:
      upper:
        - {name: POPC, ratio: 70}
        - {name: CHOL, ratio: 30}
      lower:
        - {name: POPC, ratio: 70}
        - {name: CHOL, ratio: 30}
    n_lipids_per_leaflet: 128
    # pad extends the membrane past the protein in XY, in nm.
    pad: 2.5

  # ---- Solvation ----
  # box_padding is the water layer along Z, in nm. It is measured from the
  # lipid-water interfaces, so a protein with a large extramembrane domain
  # needs considerably more than the 1.5 nm that suits a compact one: the
  # build stops and reports the required value rather than clipping anything.
  solvation:
    box_padding: 2.0
    remove_overlap: true

  # ---- Ions ----
  ions:
    cation: NA
    anion: CL
    concentration: 0.15
    neutralize: true

  # ---- Export ----
  # simparams belongs to export, not the top level.
  export:
    write_mdp: true
    simparams:
      constraints: h-bonds
      pcoupl_type: semisotropic
      temperature: 310.0
      gen_seed: 42
