name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          lfs: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Verify tag and bundled payloads
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('.')
          version = re.search(r'__version__ = "([^"]+)"', (root / 'src/gmxbuilder/__version__.py').read_text()).group(1)
          assert os.environ['RELEASE_TAG'] == 'v' + version
          for entry in json.loads(__import__('subprocess').check_output(['git', 'lfs', 'ls-files', '--json']))['files']:
              path = root / entry['name']
              assert path.stat().st_size == entry['size']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['oid']
          PY
      - name: Build distributions
        run: uv build --out-dir dist/release
      - name: Verify distribution boundaries
        run: python scripts/verify_release_packages.py dist/release
      - name: Assemble release files
        run: |
          cp docs/USER_MANUAL.pdf docs/USER_MANUAL.zh-CN.pdf docs/RELEASE_NOTES_1.0.0.md docs/RELEASE_NOTES_1.0.0.zh-CN.md dist/release/
          cd dist/release
          sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "GMXBUILDER $RELEASE_TAG" --notes-file docs/RELEASE_NOTES_1.0.0.md
          fi
          gh release upload "$RELEASE_TAG" dist/release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
